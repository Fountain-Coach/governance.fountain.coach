<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Reframe design mock: the FCIS-KIT Instrument Store as a MIDI2 capability plane</title>
  <desc id="desc">A deterministic governance mock showing Reframe as host, FCIS-KIT as the construction and admission boundary, local and remote instruments, and the scenario-to-evidence lifecycle. It is not live evidence.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#61737d" flood-opacity=".16"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5f8798"/></marker>
  </defs>
  <rect width="1600" height="900" fill="#f7f9fa"/>
  <rect x="36" y="36" width="1528" height="828" rx="18" fill="#fbfcfc" stroke="#c8d3d8" stroke-width="2"/>
  <text x="78" y="90" fill="#263845" font-family="Courier New, monospace" font-size="22" font-weight="700" letter-spacing="3">REFRAME GOVERNANCE · CHAPTER 91</text>
  <text x="78" y="122" fill="#6c7d86" font-family="Courier New, monospace" font-size="16">DESIGN MOCK · NOT LIVE EVIDENCE · FCIS-KIT CAPABILITY PLANE</text>
  <text x="1520" y="90" text-anchor="end" fill="#6c7d86" font-family="Courier New, monospace" font-size="14">SCENARIO / MIDI2 / STORE / WITNESS</text>

  <rect x="82" y="184" width="350" height="322" rx="16" fill="#fff" stroke="#aebfc7" stroke-width="2" filter="url(#shadow)"/>
  <text x="112" y="226" fill="#6c7d86" font-family="Courier New, monospace" font-size="14" letter-spacing="2">HOST AUTHORITY</text>
  <text x="112" y="270" fill="#263845" font-family="Courier New, monospace" font-size="28" font-weight="700">REFRAME</text>
  <text x="112" y="304" fill="#5b7480" font-family="Courier New, monospace" font-size="15">Copilot · mediation · project</text>
  <line x1="112" y1="330" x2="402" y2="330" stroke="#c8d3d8" stroke-width="2"/>
  <g fill="#344c58" font-family="Courier New, monospace" font-size="16">
    <circle cx="126" cy="366" r="5" fill="#4f899d"/><text x="146" y="372">intent and policy</text>
    <circle cx="126" cy="400" r="5" fill="#4f899d"/><text x="146" y="406">admission and lanes</text>
    <circle cx="126" cy="434" r="5" fill="#4f899d"/><text x="146" y="440">Store and AX proof</text>
  </g>
  <text x="112" y="478" fill="#9a5e50" font-family="Courier New, monospace" font-size="14" font-weight="700">HOST OWNS ACCEPTANCE</text>

  <rect x="520" y="162" width="560" height="366" rx="18" fill="#e8f0f3" stroke="#4f899d" stroke-width="3" filter="url(#shadow)"/>
  <text x="800" y="214" text-anchor="middle" fill="#263845" font-family="Courier New, monospace" font-size="30" font-weight="700">FCIS-KIT STORE</text>
  <text x="800" y="244" text-anchor="middle" fill="#5b7480" font-family="Courier New, monospace" font-size="15">construction · admission · capability registry</text>
  <line x1="580" y1="270" x2="1020" y2="270" stroke="#a9bec7" stroke-width="2"/>
  <g fill="#344c58" font-family="Courier New, monospace" font-size="17">
    <circle cx="608" cy="312" r="6" fill="#4f899d"/><text x="632" y="318">typed MIDI2 capability surface</text>
    <circle cx="608" cy="350" r="6" fill="#4f899d"/><text x="632" y="356">permissions · lanes · provenance</text>
    <circle cx="608" cy="388" r="6" fill="#4f899d"/><text x="632" y="394">scenario · lifecycle · receipt</text>
    <circle cx="608" cy="426" r="6" fill="#4f899d"/><text x="632" y="432">local or remote implementation</text>
  </g>
  <rect x="580" y="462" width="440" height="42" rx="8" fill="#fbfcfc" stroke="#aebfc7"/>
  <text x="800" y="489" text-anchor="middle" fill="#9a5e50" font-family="Courier New, monospace" font-size="13" font-weight="700">COMPILE ≠ ADMIT ≠ LIVE-ACCEPT ≠ RELEASE</text>

  <rect x="1168" y="184" width="350" height="322" rx="16" fill="#fff" stroke="#aebfc7" stroke-width="2" filter="url(#shadow)"/>
  <text x="1198" y="226" fill="#6c7d86" font-family="Courier New, monospace" font-size="14" letter-spacing="2">ADMITTED CAPABILITIES</text>
  <rect x="1198" y="258" width="290" height="78" rx="10" fill="#e8f3f5" stroke="#4f899d" stroke-width="2"/>
  <text x="1343" y="288" text-anchor="middle" fill="#263845" font-family="Courier New, monospace" font-size="18" font-weight="700">LOCAL INSTRUMENT</text>
  <text x="1343" y="314" text-anchor="middle" fill="#5b7480" font-family="Courier New, monospace" font-size="13">Swift · Core ML · AVFoundation</text>
  <rect x="1198" y="356" width="290" height="78" rx="10" fill="#f4f6f6" stroke="#aebfc7" stroke-width="2"/>
  <text x="1343" y="386" text-anchor="middle" fill="#263845" font-family="Courier New, monospace" font-size="18" font-weight="700">REMOTE INSTRUMENT</text>
  <text x="1343" y="412" text-anchor="middle" fill="#5b7480" font-family="Courier New, monospace" font-size="13">service · compute · publishing</text>
  <text x="1198" y="474" fill="#9a5e50" font-family="Courier New, monospace" font-size="13" font-weight="700">LOCATION DOES NOT CHANGE AUTHORITY</text>

  <g stroke="#5f8798" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M432 346 C468 346 482 346 520 346"/><path d="M1080 346 C1118 346 1130 346 1168 346"/></g>
  <text x="476" y="330" text-anchor="middle" fill="#5f8798" font-family="Courier New, monospace" font-size="13">host</text>
  <text x="1124" y="330" text-anchor="middle" fill="#5f8798" font-family="Courier New, monospace" font-size="13">admit</text>

  <rect x="82" y="592" width="1436" height="156" rx="14" fill="#eef3f4" stroke="#aebfc7" stroke-width="2"/>
  <text x="112" y="628" fill="#263845" font-family="Courier New, monospace" font-size="17" font-weight="700">SCENARIO-FIRST INSTRUMENT LIFECYCLE</text>
  <g font-family="Courier New, monospace" font-size="13" font-weight="700" text-anchor="middle">
    <rect x="112" y="650" width="170" height="34" rx="6" fill="#fbfcfc" stroke="#7da5b3"/><text x="197" y="672" fill="#344c58">SCENARIO</text>
    <path d="M282 667 H306" stroke="#5f8798" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="310" y="650" width="170" height="34" rx="6" fill="#fbfcfc" stroke="#7da5b3"/><text x="395" y="672" fill="#344c58">BUILD</text>
    <path d="M480 667 H504" stroke="#5f8798" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="508" y="650" width="170" height="34" rx="6" fill="#fbfcfc" stroke="#7da5b3"/><text x="593" y="672" fill="#344c58">EXECUTE</text>
    <path d="M678 667 H702" stroke="#5f8798" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="706" y="650" width="170" height="34" rx="6" fill="#fbfcfc" stroke="#7da5b3"/><text x="791" y="672" fill="#344c58">WITNESS</text>
    <path d="M876 667 H900" stroke="#5f8798" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="904" y="650" width="170" height="34" rx="6" fill="#fbfcfc" stroke="#7da5b3"/><text x="989" y="672" fill="#344c58">ADMIT</text>
    <path d="M1074 667 H1098" stroke="#5f8798" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="1102" y="650" width="300" height="34" rx="6" fill="#dcecf0" stroke="#4f899d"/><text x="1252" y="672" fill="#263845">REUSE / PUBLISH</text>
  </g>
  <text x="800" y="720" text-anchor="middle" fill="#6c7d86" font-family="Courier New, monospace" font-size="14">MIDI2 operation · FountainStore receipt · AX projection · independent evidence · release authority</text>

  <text x="800" y="808" text-anchor="middle" fill="#6c7d86" font-family="Courier New, monospace" font-size="13">Fountain Coach · deterministic declarative SVG · Chapter 91</text>
  <text x="800" y="834" text-anchor="middle" fill="#9a5e50" font-family="Courier New, monospace" font-size="13" font-weight="700">GOVERNED ARCHITECTURE · NOT A CLAIM THAT THE PUBLIC STORE ALREADY EXISTS</text>
</svg>
