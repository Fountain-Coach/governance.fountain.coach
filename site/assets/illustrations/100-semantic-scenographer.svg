<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Semantic Scenographer design reference</title>
  <desc id="desc">A source passage and semantic address feed a structured Teatro spatial score. The score contains a figure, a threshold, a distance field, and a trajectory. This is a design reference, not live evidence.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f4ee"/>
      <stop offset="1" stop-color="#e7edf2"/>
    </linearGradient>
    <linearGradient id="stage" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17252e"/>
      <stop offset="1" stop-color="#304653"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#d97757"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#18252d" flood-opacity=".16"/>
    </filter>
  </defs>
  <rect width="1200" height="760" fill="url(#paper)"/>
  <text x="70" y="72" fill="#17252e" font-family="system-ui, sans-serif" font-size="18" font-weight="700" letter-spacing="3">SEMANTIC SCENOGRAPHER</text>
  <text x="70" y="106" fill="#52636d" font-family="system-ui, sans-serif" font-size="17">think with the work in space</text>
  <rect x="70" y="142" width="1060" height="42" rx="21" fill="#fff" stroke="#c7d0d5"/>
  <text x="92" y="169" fill="#a9503f" font-family="ui-monospace, monospace" font-size="14" font-weight="700">DESIGN REFERENCE · NOT LIVE EVIDENCE</text>

  <g filter="url(#shadow)">
    <rect x="70" y="238" width="270" height="390" rx="18" fill="#fff" stroke="#c7d0d5"/>
    <text x="98" y="280" fill="#17252e" font-family="system-ui, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">SOURCE PASSAGE</text>
    <rect x="98" y="306" width="211" height="4" rx="2" fill="#d9e0e3"/>
    <rect x="98" y="330" width="180" height="4" rx="2" fill="#d9e0e3"/>
    <rect x="98" y="354" width="198" height="4" rx="2" fill="#d9e0e3"/>
    <rect x="98" y="378" width="155" height="4" rx="2" fill="#d9e0e3"/>
    <rect x="98" y="402" width="210" height="4" rx="2" fill="#d9e0e3"/>
    <rect x="98" y="426" width="172" height="4" rx="2" fill="#d9e0e3"/>
    <rect x="98" y="450" width="194" height="4" rx="2" fill="#d9e0e3"/>
    <rect x="98" y="474" width="130" height="4" rx="2" fill="#d9e0e3"/>
    <rect x="98" y="520" width="196" height="34" rx="9" fill="#f3e8df"/>
    <text x="112" y="542" fill="#a9503f" font-family="ui-monospace, monospace" font-size="11">lines 8341–8426</text>
    <text x="98" y="589" fill="#52636d" font-family="system-ui, sans-serif" font-size="12">source identity · beat · note</text>
  </g>

  <path d="M365 432 C405 432 420 432 454 432" fill="none" stroke="#d97757" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="370" y="407" fill="#a9503f" font-family="system-ui, sans-serif" font-size="13" font-weight="700">composite address</text>

  <g filter="url(#shadow)">
    <rect x="478" y="238" width="250" height="390" rx="18" fill="#fff" stroke="#c7d0d5"/>
    <text x="507" y="280" fill="#17252e" font-family="system-ui, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">SCENOGRAPHER</text>
    <text x="507" y="315" fill="#52636d" font-family="system-ui, sans-serif" font-size="13">spatial interpretation</text>
    <circle cx="548" cy="384" r="30" fill="#d97757" opacity=".9"/>
    <rect x="591" y="348" width="80" height="72" rx="12" fill="#dfe8ec"/>
    <path d="M525 492 C570 446 638 446 688 492" fill="none" stroke="#d97757" stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="522" y1="540" x2="685" y2="540" stroke="#b9c6cc" stroke-width="2" stroke-dasharray="6 7"/>
    <text x="507" y="582" fill="#52636d" font-family="system-ui, sans-serif" font-size="12">distance · threshold · trajectory</text>
  </g>

  <path d="M753 432 C793 432 808 432 842 432" fill="none" stroke="#d97757" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="765" y="407" fill="#a9503f" font-family="system-ui, sans-serif" font-size="13" font-weight="700">structured score</text>

  <g filter="url(#shadow)">
    <rect x="866" y="238" width="264" height="390" rx="18" fill="url(#stage)"/>
    <text x="896" y="280" fill="#f8fafb" font-family="system-ui, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">TEATRO SCORE</text>
    <line x1="898" y1="338" x2="1094" y2="338" stroke="#91a6af" stroke-width="2" stroke-dasharray="3 7"/>
    <circle cx="950" cy="430" r="28" fill="#d97757"/>
    <rect x="1031" y="386" width="12" height="166" rx="6" fill="#d7b45f"/>
    <circle cx="1037" cy="386" r="9" fill="#f5d98b"/>
    <path d="M949 470 C980 420 1003 470 1037 430" fill="none" stroke="#d97757" stroke-width="4" marker-end="url(#arrow)"/>
    <ellipse cx="995" cy="520" rx="92" ry="25" fill="#91a6af" opacity=".24"/>
    <text x="896" y="589" fill="#b8c8ce" font-family="system-ui, sans-serif" font-size="12">inspectable objects · source links</text>
  </g>
</svg>
