<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Remote SecretStore authorization session</title><desc id="desc">A trusted phone approves a bounded request. A native host adapter receives a short-lived credential lease from SecretStore and produces a redacted terminal receipt. The secret never crosses the approval or evidence channels.</desc><rect width="1200" height="700" rx="28" fill="#101820"/><text x="70" y="82" fill="#f4f1e8" font-family="sans-serif" font-size="30" font-weight="700">REMOTE SECRETSTORE AUTHORIZATION</text><text x="70" y="118" fill="#a9bac2" font-family="sans-serif" font-size="18">one approval · one scoped lease · no secret in the conversation</text><g font-family="sans-serif"><rect x="72" y="190" width="220" height="270" rx="24" fill="#22313b" stroke="#78d5c0" stroke-width="3"/><rect x="132" y="225" width="100" height="170" rx="14" fill="#101820" stroke="#d7e4e8" stroke-width="3"/><circle cx="182" cy="370" r="8" fill="#78d5c0"/><text x="182" y="438" text-anchor="middle" fill="#f4f1e8" font-size="21" font-weight="700">TRUSTED DEVICE</text><text x="182" y="490" text-anchor="middle" fill="#78d5c0" font-size="17">approve / deny</text><rect x="370" y="190" width="250" height="270" rx="24" fill="#2d273b" stroke="#d9a8ff" stroke-width="3"/><text x="495" y="245" text-anchor="middle" fill="#f4f1e8" font-size="22" font-weight="700">APPROVAL SESSION</text><text x="410" y="292" fill="#d9a8ff" font-size="17">target</text><text x="410" y="320" fill="#f4f1e8" font-size="18">governance route</text><text x="410" y="360" fill="#d9a8ff" font-size="17">scope</text><text x="410" y="388" fill="#f4f1e8" font-size="18">one bounded write</text><text x="410" y="428" fill="#d9a8ff" font-size="17">nonce · expiry</text><text x="410" y="456" fill="#f4f1e8" font-size="18">bound and one-time</text><rect x="700" y="160" width="220" height="125" rx="20" fill="#203b3e" stroke="#78d5c0" stroke-width="3"/><text x="810" y="207" text-anchor="middle" fill="#f4f1e8" font-size="21" font-weight="700">SECRETSTORE</text><text x="810" y="243" text-anchor="middle" fill="#78d5c0" font-size="17">custody only</text><rect x="700" y="335" width="220" height="125" rx="20" fill="#3b3020" stroke="#f3c56b" stroke-width="3"/><text x="810" y="382" text-anchor="middle" fill="#f4f1e8" font-size="21" font-weight="700">HOST ADAPTER</text><text x="810" y="418" text-anchor="middle" fill="#f3c56b" font-size="17">lease · use · release</text><rect x="1000" y="240" width="140" height="155" rx="18" fill="#24383e" stroke="#78d5c0" stroke-width="3"/><text x="1070" y="285" text-anchor="middle" fill="#f4f1e8" font-size="18" font-weight="700">TERMINAL</text><text x="1070" y="318" text-anchor="middle" fill="#f4f1e8" font-size="18">receipt</text><text x="1070" y="356" text-anchor="middle" fill="#78d5c0" font-size="16">redacted</text></g><g fill="none" stroke-width="5" stroke-linecap="round"><path d="M292 325H370" stroke="#78d5c0"/><path d="M620 260H700" stroke="#d9a8ff"/><path d="M810 285V335" stroke="#f3c56b"/><path d="M920 397H1000" stroke="#78d5c0"/></g><g fill="#a9bac2" font-family="sans-serif" font-size="16"><text x="70" y="590">MIDI2 / chat: redacted decision only</text><text x="470" y="590">Secret never enters Store, logs, or screenshots</text><text x="870" y="590">scope mismatch → terminal refusal</text></g></svg>
