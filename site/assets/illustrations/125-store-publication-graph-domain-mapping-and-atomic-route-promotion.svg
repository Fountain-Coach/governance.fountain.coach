<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc">
  <title id="title">The Store publication graph maps one route to another domain</title>
  <desc id="desc">A source route in State A enters a governed route mapping instrument and becomes a destination route in State B, followed by FountainStore promotion and DNS HTTPS proof.</desc>
  <defs>
    <linearGradient id="paper" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#fffdf8"/><stop offset="1" stop-color="#f3efe7"/></linearGradient>
    <linearGradient id="violet" x1="0" x2="1"><stop stop-color="#6656ca"/><stop offset="1" stop-color="#463a9b"/></linearGradient>
    <linearGradient id="mint" x1="0" x2="1"><stop stop-color="#d9eee6"/><stop offset="1" stop-color="#b8ded2"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#253047" flood-opacity=".13"/></filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#6656ca"/></marker>
    <marker id="mint-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#16816d"/></marker>
  </defs>
  <rect width="1400" height="800" fill="url(#paper)"/>
  <rect x="30" y="30" width="1340" height="740" rx="28" fill="none" stroke="#d8d0c3" stroke-width="2"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif">
    <text x="82" y="92" fill="#665f57" font-size="21" font-weight="700" letter-spacing="5">GOVERNANCE 125</text>
    <text x="82" y="145" fill="#20283a" font-size="42" font-weight="750">A route moves by declared identity</text>
    <text x="82" y="180" fill="#665f57" font-size="19">source route · mapping rule · destination route · Store and edge proof</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="70" y="260" width="350" height="250" rx="22" fill="#fff" stroke="#c9c0b3" stroke-width="2"/>
    <rect x="525" y="225" width="350" height="315" rx="25" fill="url(#violet)"/>
    <rect x="980" y="260" width="350" height="250" rx="22" fill="#fff" stroke="#c9c0b3" stroke-width="2"/>
    <rect x="250" y="625" width="900" height="90" rx="20" fill="url(#mint)" stroke="#acd2c6" stroke-width="2"/>
  </g>
  <g font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif">
    <text x="110" y="308" fill="#6656ca" font-size="16" font-weight="750" letter-spacing="2">STATE A · SOURCE ROUTE</text>
    <text x="110" y="356" fill="#20283a" font-size="22" font-weight="750">governance.fountain</text>
    <text x="110" y="384" fill="#20283a" font-size="22" font-weight="750">.coach</text>
    <text x="110" y="430" fill="#20283a" font-size="19">/chapters/123/...</text>
    <text x="110" y="468" fill="#665f57" font-size="17">files · assets · canonical identity</text>
    <text x="110" y="493" fill="#665f57" font-size="17">revision + predecessor</text>

    <text x="565" y="276" fill="#f5f2ff" font-size="16" font-weight="750" letter-spacing="2">FCIS-KIT INSTRUMENT</text>
    <text x="565" y="330" fill="#fff" font-size="29" font-weight="750">Route mapping</text>
    <line x1="565" y1="358" x2="835" y2="358" stroke="#a99df1" stroke-width="2"/>
    <text x="565" y="399" fill="#f5f2ff" font-size="18">select · validate · transform</text>
    <text x="565" y="433" fill="#f5f2ff" font-size="18">rewrite host-bound metadata</text>
    <text x="565" y="467" fill="#f5f2ff" font-size="18">preview · approve · commit</text>
    <text x="565" y="505" fill="#f5f2ff" font-size="16" font-weight="700">new State B, never in-place</text>

    <text x="1020" y="308" fill="#16816d" font-size="16" font-weight="750" letter-spacing="2">STATE B · DESTINATION</text>
    <text x="1020" y="334" fill="#16816d" font-size="16" font-weight="750" letter-spacing="2">ROUTE</text>
    <text x="1020" y="382" fill="#20283a" font-size="22" font-weight="750">book.fountain</text>
    <text x="1020" y="410" fill="#20283a" font-size="22" font-weight="750">.coach</text>
    <text x="1020" y="456" fill="#20283a" font-size="19">/reference/commands/...</text>
    <text x="1020" y="484" fill="#665f57" font-size="17">new file identities + digest</text>

    <text x="292" y="662" fill="#20594f" font-size="21" font-weight="750">FOUNTAINSTORE PUBLICATION GRAPH</text>
    <text x="292" y="692" fill="#356e63" font-size="17">atomic promotion · remote read-back · DNS / HTTPS witness · matching digest</text>
    <text x="82" y="752" fill="#665f57" font-size="16">DNS proves the edge is reachable. The Store proves which route and revision were admitted.</text>
  </g>
  <g font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif" font-size="15" font-weight="700">
    <rect x="445" y="390" width="70" height="26" rx="13" fill="#fffdf8"/>
    <text x="480" y="408" text-anchor="middle" fill="#6656ca">map</text>
    <rect x="885" y="390" width="112" height="26" rx="13" fill="#fffdf8"/>
    <text x="941" y="408" text-anchor="middle" fill="#6656ca">materialize</text>
  </g>
  <path d="M430 445 H510" fill="none" stroke="#6656ca" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M886 445 H970" fill="none" stroke="#6656ca" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1155 520 V575 H700 V615" fill="none" stroke="#16816d" stroke-width="3" marker-end="url(#mint-arrow)"/>
</svg>
