<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1020" role="img" aria-labelledby="title desc">
  <title id="title">Reframe Reading Room remote MIDI2 peer projection</title>
  <desc id="desc">A Reframe workspace showing a shared manuscript, semantic navigation, Copilot, and a connected remote reader peer.</desc>
  <defs>
    <linearGradient id="paper" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#f7f8fa"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#172033" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1800" height="1020" fill="#eef1f5"/>
  <rect x="38" y="34" width="1724" height="952" rx="24" fill="url(#paper)" filter="url(#shadow)"/>
  <rect x="38" y="34" width="1724" height="64" rx="24" fill="#fbfcfd"/>
  <circle cx="78" cy="66" r="9" fill="#ff5f57"/><circle cx="108" cy="66" r="9" fill="#febc2e"/><circle cx="138" cy="66" r="9" fill="#28c840"/>
  <text x="184" y="74" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#18202a">REFRAME</text>
  <text x="1502" y="74" font-family="Arial, sans-serif" font-size="15" fill="#6c7682">READING ROOM · CONNECTED</text>
  <rect x="38" y="98" width="1724" height="48" fill="#f4f6f8"/>
  <text x="74" y="129" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#697481">MANUSCRIPT</text>
  <text x="262" y="129" font-family="Arial, sans-serif" font-size="14" fill="#55616e">Questions · Movements · Read coverage</text>
  <text x="1425" y="129" font-family="Arial, sans-serif" font-size="14" fill="#55616e">Shared with 2 readers</text>

  <rect x="38" y="146" width="312" height="692" fill="#fafbfc"/>
  <text x="72" y="185" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#687481">READING NAVIGATION</text>
  <circle cx="76" cy="222" r="6" fill="#2f7df6"/><text x="96" y="228" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1a2735">Read coverage</text>
  <text x="96" y="252" font-family="Arial, sans-serif" font-size="13" fill="#7a8490">lines 1–46 · shared</text>
  <rect x="64" y="278" width="240" height="54" rx="8" fill="#e8f1ff"/><circle cx="84" cy="305" r="5" fill="#2f7df6"/><text x="102" y="301" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#245eb5">Questions</text><text x="102" y="320" font-family="Arial, sans-serif" font-size="12" fill="#4c6d98">3 open threads</text>
  <circle cx="76" cy="370" r="6" fill="#25b765"/><text x="96" y="376" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1a2735">Movements</text>
  <text x="96" y="400" font-family="Arial, sans-serif" font-size="13" fill="#7a8490">2 grounded changes</text>
  <line x1="72" y1="440" x2="300" y2="440" stroke="#dce2e8"/>
  <text x="72" y="478" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.4" fill="#687481">PEERS</text>
  <circle cx="80" cy="516" r="6" fill="#25b765"/><text x="98" y="522" font-family="Arial, sans-serif" font-size="15" fill="#263340">This Reframe</text><text x="98" y="544" font-family="Arial, sans-serif" font-size="12" fill="#7a8490">target writer · admitted</text>
  <circle cx="80" cy="580" r="6" fill="#2f7df6"/><text x="98" y="586" font-family="Arial, sans-serif" font-size="15" fill="#263340">Mara’s Reading Room</text><text x="98" y="608" font-family="Arial, sans-serif" font-size="12" fill="#7a8490">remote peer · observing</text>
  <rect x="64" y="656" width="240" height="116" rx="10" fill="#fff8e8" stroke="#f0d28a"/>
  <text x="84" y="683" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2" fill="#a36e13">WRITER AUTHORITY</text>
  <text x="84" y="710" font-family="Arial, sans-serif" font-size="13" fill="#594615">Remote readers can request</text><text x="84" y="730" font-family="Arial, sans-serif" font-size="13" fill="#594615">operations; you approve them.</text>

  <rect x="350" y="146" width="878" height="692" fill="#fff"/>
  <text x="410" y="190" font-family="Courier New, monospace" font-size="18" font-weight="700" fill="#2b3440">TITLE: THE SECOND KEY</text>
  <text x="410" y="224" font-family="Courier New, monospace" font-size="16" fill="#5d6975">AUTHOR: REFRAME READING ROOM FIXTURE</text>
  <line x1="410" y1="252" x2="1165" y2="252" stroke="#e1e5e9"/>
  <g font-family="Courier New, monospace" font-size="17" fill="#26313c">
    <text x="402" y="302" fill="#9aa4ad">1</text><text x="438" y="302">The door was open when the list was written.</text>
    <text x="402" y="348" fill="#9aa4ad">2</text><text x="438" y="348">No one remembers who turned the key.</text>
    <text x="402" y="394" fill="#9aa4ad">3</text><text x="438" y="394">Mara reads the margin twice.</text>
    <text x="402" y="440" fill="#9aa4ad">4</text><text x="438" y="440">The west room remains unaccounted for.</text>
    <text x="402" y="486" fill="#9aa4ad">5</text><text x="438" y="486">A bell sounds somewhere beyond the page.</text>
    <text x="402" y="532" fill="#9aa4ad">6</text><text x="438" y="532">The second reader asks what changed.</text>
  </g>
  <rect x="430" y="276" width="10" height="278" rx="5" fill="#2f7df6" opacity=".9"/><rect x="430" y="368" width="10" height="92" rx="5" fill="#25b765"/>
  <rect x="410" y="584" width="748" height="98" rx="10" fill="#f4f8ff" stroke="#c9ddff"/>
  <text x="434" y="612" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2" fill="#2868c9">OPEN QUESTION · SHARED</text>
  <text x="434" y="640" font-family="Arial, sans-serif" font-size="15" fill="#283b54">What changed between the first and second reading?</text>
  <text x="434" y="663" font-family="Arial, sans-serif" font-size="12" fill="#6c7d91">lines 1–6 · requested by Mara · target writer decides next operation</text>

  <rect x="1228" y="146" width="534" height="692" fill="#fbfcfd"/>
  <text x="1268" y="190" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#687481">COPILOT</text>
  <circle cx="1278" cy="232" r="7" fill="#2f7df6"/><text x="1300" y="238" font-family="Arial, sans-serif" font-size="15" fill="#263340">Mara requested a second reading.</text>
  <text x="1300" y="263" font-family="Arial, sans-serif" font-size="13" fill="#7a8490">Awaiting your confirmation.</text>
  <rect x="1268" y="302" width="434" height="132" rx="12" fill="#fff" stroke="#dfe5eb"/>
  <text x="1292" y="334" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2" fill="#697481">REQUESTED OPERATION</text>
  <text x="1292" y="366" font-family="Courier New, monospace" font-size="14" fill="#263340">storify.source.start</text>
  <text x="1292" y="393" font-family="Arial, sans-serif" font-size="13" fill="#6c7782">Paid-first mediated lane · no provider selected</text>
  <rect x="1292" y="411" width="132" height="34" rx="7" fill="#2f7df6"/><text x="1318" y="433" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#fff">Review request</text>
  <line x1="1268" y1="486" x2="1702" y2="486" stroke="#dfe5eb"/>
  <text x="1268" y="524" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2" fill="#687481">ACTIVITY</text>
  <circle cx="1280" cy="562" r="6" fill="#25b765"/><text x="1300" y="568" font-family="Arial, sans-serif" font-size="14" fill="#33414e">Peer connected · MIDI-CI admitted</text>
  <circle cx="1280" cy="604" r="6" fill="#2f7df6"/><text x="1300" y="610" font-family="Arial, sans-serif" font-size="14" fill="#33414e">Question projection synchronized</text>
  <circle cx="1280" cy="646" r="6" fill="#f0a52b"/><text x="1300" y="652" font-family="Arial, sans-serif" font-size="14" fill="#33414e">Writer confirmation required</text>
  <text x="1268" y="750" font-family="Arial, sans-serif" font-size="12" fill="#7a8490">MIDI2 lifecycle · FountainStore receipt · AX-visible</text>

  <rect x="38" y="838" width="1724" height="148" rx="0 0 24 24" fill="#f4f6f8"/>
  <text x="76" y="875" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.8" fill="#687481">MIDI2 PEERS · READING ROOM</text>
  <rect x="76" y="898" width="420" height="52" rx="9" fill="#fff" stroke="#dfe5eb"/><circle cx="103" cy="924" r="7" fill="#25b765"/><text x="124" y="930" font-family="Arial, sans-serif" font-size="14" fill="#263340">This Reframe ↔ Mara’s Reading Room</text>
  <line x1="530" y1="924" x2="1130" y2="924" stroke="#2f7df6" stroke-width="3"/><circle cx="530" cy="924" r="7" fill="#2f7df6"/><circle cx="1130" cy="924" r="7" fill="#2f7df6"/>
  <text x="1190" y="930" font-family="Arial, sans-serif" font-size="14" fill="#53606c">connected · 1 open request · 3 shared questions</text>
</svg>
