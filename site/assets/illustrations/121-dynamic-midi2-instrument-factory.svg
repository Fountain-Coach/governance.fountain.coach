<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Dynamic MIDI2 instrument factory</title>
  <desc id="desc">Reframe discovers admitted MIDI2 instruments through a generic boundary while a Swift factory builds new instruments in a pinned Linux image and records evidence in FountainStore.</desc>
  <defs><linearGradient id="paper" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#fffdf8"/><stop offset="1" stop-color="#f2eee6"/></linearGradient><linearGradient id="blue" x1="0" x2="1"><stop stop-color="#173b63"/><stop offset="1" stop-color="#275d7c"/></linearGradient><linearGradient id="gold" x1="0" x2="1"><stop stop-color="#e8a63b"/><stop offset="1" stop-color="#f2c96b"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#173b63" flood-opacity=".14"/></filter><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#d6902f"/></marker></defs>
  <rect width="1400" height="760" fill="url(#paper)"/><rect x="26" y="26" width="1348" height="708" rx="28" fill="none" stroke="#173b63" stroke-width="2" opacity=".25"/>
  <text x="78" y="92" fill="#173b63" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif" font-size="22" letter-spacing="5">GOVERNANCE 121</text><text x="78" y="143" fill="#173b63" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif" font-size="42" font-weight="700">The dynamic instrument boundary</text><text x="78" y="177" fill="#5a6873" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif" font-size="19">discover at runtime · build once in a governed Swift lane · keep evidence durable</text>
  <g filter="url(#shadow)"><rect x="78" y="247" width="270" height="190" rx="20" fill="#fff" stroke="#b7c8d2" stroke-width="2"/><rect x="565" y="227" width="270" height="230" rx="135" fill="url(#gold)" stroke="#c47d20" stroke-width="2"/><rect x="1052" y="247" width="270" height="190" rx="20" fill="#fff" stroke="#b7c8d2" stroke-width="2"/><rect x="360" y="536" width="680" height="126" rx="20" fill="url(#blue)"/></g>
  <g fill="#173b63" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif"><text x="108" y="300" font-size="22" font-weight="700">REFRAME</text><text x="108" y="338" font-size="18">Composer</text><text x="108" y="369" font-size="18">generic MIDI2 host</text><text x="108" y="400" font-size="18">reason over profiles</text><text x="700" y="300" text-anchor="middle" font-size="24" font-weight="700">MIDI2</text><text x="700" y="337" text-anchor="middle" font-size="18">discover</text><text x="700" y="367" text-anchor="middle" font-size="18">invoke</text><text x="700" y="397" text-anchor="middle" font-size="18">correlate</text><text x="700" y="429" text-anchor="middle" font-size="15" font-weight="700">one shared boundary</text><text x="1082" y="300" font-size="22" font-weight="700">ADMITTED</text><text x="1082" y="338" font-size="18">instrument profiles</text><text x="1082" y="369" font-size="18">stable identity</text><text x="1082" y="400" font-size="18">typed operation</text></g>
  <path d="M348 342 H550" fill="none" stroke="#d6902f" stroke-width="5" marker-end="url(#arrow)"/><path d="M850 342 H1040" fill="none" stroke="#d6902f" stroke-width="5" marker-end="url(#arrow)"/><path d="M700 466 V522" fill="none" stroke="#d6902f" stroke-width="5" marker-end="url(#arrow)"/>
  <g fill="#fffdf8" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif"><text x="400" y="579" font-size="21" font-weight="700">SWIFT INSTRUMENT FACTORY</text><text x="400" y="614" font-size="17">pinned Linux image · batch build · cache · tests</text><text x="400" y="641" font-size="17">admission evidence → FountainStore</text></g><text x="78" y="700" fill="#5a6873" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif" font-size="17">No new Reframe switch case for each admitted instrument.</text>
</svg>
