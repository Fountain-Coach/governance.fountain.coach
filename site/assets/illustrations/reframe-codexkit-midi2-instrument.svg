<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Reframe design mock: CodexKit as a kit-level MIDI2 instrument</title>
  <desc id="desc">A deterministic governance mock showing the related OpenAI Codex service at left, CodexKit as a typed Swift MIDI2 instrument in the center, and a public repository decision gate at right. The OpenAI mark is shown only for service identification and is not an endorsement.</desc>
