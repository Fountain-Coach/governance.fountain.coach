<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Scenario pipeline factory</title>
  <desc id="desc">Named scenarios enter a governed factory, pass through typed stage roles, and leave as one evidenced result.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#101b2d"/><stop offset="1" stop-color="#263d52"/></linearGradient>
    <linearGradient id="gold" x1="0" x2="1"><stop stop-color="#f4c96b"/><stop offset="1" stop-color="#e7a84f"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-opacity=".28"/></filter>
  </defs>
  <rect width="1200" height="630" rx="30" fill="url(#bg)"/>
  <path d="M90 160h250M90 265h250M90 370h250" stroke="#84a7bb" stroke-width="3" opacity=".55"/>
  <g fill="#f5f0e6" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="90" y="105" font-size="24" letter-spacing="4" fill="#b8d0d9">GOVERNANCE 119</text>
    <text x="90" y="535" font-size="36" font-weight="700">The Scenario Pipeline Factory</text>
    <text x="90" y="575" font-size="20" fill="#c4d3d4">named scenarios · typed roles · one durable result</text>
    <text x="105" y="151" font-size="18">existing</text><text x="105" y="174" font-size="18">scenario</text>
    <text x="105" y="256" font-size="18">existing</text><text x="105" y="279" font-size="18">scenario</text>
    <text x="105" y="361" font-size="18">existing</text><text x="105" y="384" font-size="18">scenario</text>
  </g>
  <g fill="url(#gold)" filter="url(#shadow)"><rect x="390" y="128" width="350" height="300" rx="26"/></g>
  <g fill="#172638" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="430" y="180" font-size="26" font-weight="700">PIPELINE</text>
    <text x="430" y="220" font-size="19">resolve by name</text><text x="430" y="254" font-size="19">bind source identity</text>
    <text x="430" y="288" font-size="19">execute serially</text><text x="430" y="322" font-size="19">persist each result</text>
    <text x="430" y="356" font-size="19">reconcile meaning</text>
    <text x="430" y="400" font-size="16" font-weight="700">NO IMPLICIT SCENARIOS</text>
  </g>
  <g stroke="#f4c96b" stroke-width="4" fill="none"><path d="M340 160h50M340 265h50M340 370h50"/><path d="M740 278h110"/></g>
  <g fill="#f5f0e6" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"><text x="870" y="205" font-size="22" font-weight="700">EVIDENCE</text><text x="870" y="245" font-size="18">AX + Store</text><text x="870" y="275" font-size="18">MIDI2 + provenance</text><text x="870" y="305" font-size="18">observed / inferred</text><text x="870" y="335" font-size="18">next bounded action</text></g>
  <circle cx="850" cy="278" r="9" fill="#f4c96b"/>
</svg>
