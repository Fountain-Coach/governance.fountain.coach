<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">The writer owns the public domain</title>
<desc id="desc">The writer owns a public domain containing writing, publication, identity, and continuity. Reframe makes that domain usable while Fountain Coach supplies capability outside the ownership boundary.</desc>
<rect width="1440" height="900" fill="#f4f0e6"/><rect x="34" y="34" width="1372" height="832" fill="none" stroke="#171717" stroke-width="2"/>
<g fill="#171717" font-family="Courier New, Courier, monospace"><text x="88" y="112" font-size="26">FCIS 157 / THE WRITER OWNS THE PUBLIC DOMAIN</text><text x="88" y="154" font-size="15">PUBLIC NAME / AUTHORED MEANING / CONTINUITY</text></g>
<g fill="none" stroke="#171717" stroke-width="2"><rect x="92" y="322" width="210" height="150"/><rect x="430" y="238" width="560" height="390"/><rect x="1080" y="322" width="270" height="150"/><path d="M302 397 H430"/><path d="M990 397 H1080"/></g>
<g fill="#171717" font-family="Courier New, Courier, monospace" text-anchor="middle"><text x="197" y="382" font-size="20">WRITER</text><text x="197" y="420" font-size="14">owns the public name</text><text x="710" y="298" font-size="22">WRITER-OWNED DOMAIN</text><text x="710" y="350" font-size="17">writing</text><text x="710" y="402" font-size="17">publication</text><text x="710" y="454" font-size="17">identity</text><text x="710" y="506" font-size="17">continuity</text><text x="710" y="578" font-size="15">REFRAME MAKES THE DOMAIN USABLE</text><text x="1215" y="382" font-size="19">FOUNTAIN COACH</text><text x="1215" y="420" font-size="14">supplies capability</text></g>
<text x="710" y="748" fill="#171717" font-family="Courier New, Courier, monospace" font-size="16" text-anchor="middle">CAPABILITY DOES NOT BECOME OWNERSHIP</text><text x="710" y="792" fill="#171717" font-family="Courier New, Courier, monospace" font-size="14" text-anchor="middle">THE PUBLIC NAME REMAINS THE WRITER'S</text>
</svg>
