<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Reframe MIDI2 Monitor architecture mock</title>
  <desc id="desc">A deterministic Reframe design mock with a central MIDI2 Monitor live event spine, surrounded by ReframeLaunch, runtime, FountainStore, AX and Copilot, Scenario Runner, and provider lanes.</desc>
  <rect width="1440" height="900" fill="#f7f9fa"/>
  <rect x="36" y="36" width="1368" height="828" rx="18" fill="#fbfcfc" stroke="#c8d3d8" stroke-width="2"/>
  <text x="76" y="92" fill="#263845" font-family="Courier New, monospace" font-size="22" font-weight="700" letter-spacing="3">REFRAME · MIDI2 MONITOR</text>
  <text x="76" y="124" fill="#6c7d86" font-family="Courier New, monospace" font-size="16">DESIGN MOCK · NOT LIVE EVIDENCE</text>
  <text x="1360" y="92" text-anchor="end" fill="#6c7d86" font-family="Courier New, monospace" font-size="14">CHAPTER 87</text>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#71838c" flood-opacity=".16"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64899a"/></marker>
  </defs>

  <rect x="535" y="190" width="370" height="470" rx="18" fill="#e8f0f3" stroke="#4f899d" stroke-width="3" filter="url(#shadow)"/>
  <text x="720" y="242" text-anchor="middle" fill="#263845" font-family="Courier New, monospace" font-size="26" font-weight="700">MIDI2 MONITOR</text>
  <text x="720" y="271" text-anchor="middle" fill="#5b7480" font-family="Courier New, monospace" font-size="15">typed live event mirror</text>
  <line x1="585" y1="300" x2="855" y2="300" stroke="#a9bec7" stroke-width="2"/>
  <circle cx="600" cy="342" r="7" fill="#4f899d"/><text x="620" y="348" fill="#344c58" font-family="Courier New, monospace" font-size="17">discovery · identity</text>
  <circle cx="600" cy="387" r="7" fill="#4f899d"/><text x="620" y="393" fill="#344c58" font-family="Courier New, monospace" font-size="17">admission · capability</text>
  <circle cx="600" cy="432" r="7" fill="#4f899d"/><text x="620" y="438" fill="#344c58" font-family="Courier New, monospace" font-size="17">running · sequence</text>
  <circle cx="600" cy="477" r="7" fill="#4f899d"/><text x="620" y="483" fill="#344c58" font-family="Courier New, monospace" font-size="17">terminal · receipt link</text>
  <line x1="585" y1="520" x2="855" y2="520" stroke="#a9bec7" stroke-width="2"/>
  <text x="720" y="555" text-anchor="middle" fill="#5b7480" font-family="Courier New, monospace" font-size="14">correlation + execution identity</text>
  <text x="720" y="581" text-anchor="middle" fill="#5b7480" font-family="Courier New, monospace" font-size="14">at-least-once · replayable · typed</text>
  <text x="720" y="620" text-anchor="middle" fill="#9a5e50" font-family="Courier New, monospace" font-size="14" font-weight="700">NO GUI INFERENCE</text>

  <g filter="url(#shadow)">
    <rect x="95" y="190" width="310" height="132" rx="12" fill="#fff" stroke="#aebfc7" stroke-width="2"/>
    <text x="125" y="232" fill="#263845" font-family="Courier New, monospace" font-size="20" font-weight="700">ReframeLaunch</text>
    <text x="125" y="264" fill="#667982" font-family="Courier New, monospace" font-size="15">PID · Store · source revision</text>
    <text x="125" y="289" fill="#667982" font-family="Courier New, monospace" font-size="15">MIDI2 readiness handshake</text>
    <rect x="1035" y="190" width="310" height="132" rx="12" fill="#fff" stroke="#aebfc7" stroke-width="2"/>
    <text x="1065" y="232" fill="#263845" font-family="Courier New, monospace" font-size="20" font-weight="700">Runtime executor</text>
    <text x="1065" y="264" fill="#667982" font-family="Courier New, monospace" font-size="15">one typed operation</text>
    <text x="1065" y="289" fill="#667982" font-family="Courier New, monospace" font-size="15">durable write, then event</text>
    <rect x="95" y="690" width="310" height="132" rx="12" fill="#fff" stroke="#aebfc7" stroke-width="2"/>
    <text x="125" y="732" fill="#263845" font-family="Courier New, monospace" font-size="20" font-weight="700">Scenario Runner</text>
    <text x="125" y="764" fill="#667982" font-family="Courier New, monospace" font-size="15">drive · wait · reconcile</text>
    <text x="125" y="789" fill="#667982" font-family="Courier New, monospace" font-size="15">not a runtime coordinator</text>
    <rect x="1035" y="690" width="310" height="132" rx="12" fill="#fff" stroke="#aebfc7" stroke-width="2"/>
    <text x="1065" y="732" fill="#263845" font-family="Courier New, monospace" font-size="20" font-weight="700">AX / Copilot</text>
    <text x="1065" y="764" fill="#667982" font-family="Courier New, monospace" font-size="15">read-only peer mirror</text>
    <text x="1065" y="789" fill="#667982" font-family="Courier New, monospace" font-size="15">labels · values · actions</text>
  </g>

  <g stroke="#64899a" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M405 256 C470 256 475 285 535 285"/>
    <path d="M1035 256 C975 256 970 285 905 285"/>
    <path d="M405 756 C470 756 475 620 535 620"/>
    <path d="M905 620 C970 620 975 756 1035 756"/>
  </g>
  <text x="450" y="243" fill="#64899a" font-family="Courier New, monospace" font-size="13">bind</text>
  <text x="960" y="243" text-anchor="end" fill="#64899a" font-family="Courier New, monospace" font-size="13">publish</text>
  <text x="450" y="706" fill="#64899a" font-family="Courier New, monospace" font-size="13">verify</text>
  <text x="960" y="706" text-anchor="end" fill="#64899a" font-family="Courier New, monospace" font-size="13">project</text>

  <rect x="535" y="690" width="370" height="132" rx="12" fill="#eef3f4" stroke="#aebfc7" stroke-width="2"/>
  <text x="720" y="730" text-anchor="middle" fill="#263845" font-family="Courier New, monospace" font-size="20" font-weight="700">FountainStore</text>
  <text x="720" y="762" text-anchor="middle" fill="#667982" font-family="Courier New, monospace" font-size="15">events · aggregates · receipts</text>
  <text x="720" y="787" text-anchor="middle" fill="#667982" font-family="Courier New, monospace" font-size="15">durable behavioral authority</text>

  <text x="720" y="854" text-anchor="middle" fill="#6c7d86" font-family="Courier New, monospace" font-size="14">MIDI2 live state ≠ Store proof ≠ AX witness ≠ release claim</text>
</svg>
