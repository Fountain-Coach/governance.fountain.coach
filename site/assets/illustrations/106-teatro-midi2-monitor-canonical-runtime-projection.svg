<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Teatro MIDI2 Monitor canonical runtime projection</title><desc id="desc">One ordered MIDI2 event stream is projected into a structured Teatro score that supports live view, SVG, replay, and inspection.</desc>
<style>.t{font:700 36px -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;fill:#172532}.s{font:400 19px -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;fill:#526875}.e{font:700 13px -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;letter-spacing:2px;fill:#69818d}.h{font:700 22px -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;fill:#172532}.b{font:400 16px -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;fill:#526875}.m{font:600 16px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#dce8ed}</style>
<rect width="1200" height="700" fill="#f5f8f9"/><text x="60" y="58" class="e">TEATRO RUNTIME PROJECTION · CHAPTER 106</text><text x="60" y="108" class="t">One score, many truthful views</text><text x="60" y="140" class="s">MIDI2 orders the facts; Teatro makes their state inspectable.</text>
<rect x="60" y="214" width="280" height="240" rx="18" fill="#193448"/><text x="92" y="258" class="m">MIDI2 MONITOR</text><text x="92" y="304" class="m">01 started</text><text x="92" y="338" class="m">02 progress</text><text x="92" y="372" class="m">03 terminal</text><text x="92" y="424" class="b">sequence · correlation</text><path d="M340 334H465" stroke="#587487" stroke-width="4"/>
<rect x="485" y="184" width="290" height="300" rx="18" fill="#e2f1ee" stroke="#a9d1c9" stroke-width="2"/><text x="520" y="228" class="h">Teatro score</text><text x="520" y="270" class="b">typed event objects</text><circle cx="570" cy="340" r="32" fill="#efb75b"/><circle cx="680" cy="380" r="42" fill="#78c9c1"/><path d="M600 340C630 315 650 375 675 380" fill="none" stroke="#587487" stroke-width="4"/><text x="520" y="442" class="b">state · geometry · time</text><path d="M775 334H900" stroke="#587487" stroke-width="4"/>
<rect x="920" y="184" width="220" height="112" rx="16" fill="#e5edf7" stroke="#b7cce1" stroke-width="2"/><text x="952" y="228" class="h">Live view</text><text x="952" y="264" class="b">native / web</text><rect x="920" y="324" width="220" height="112" rx="16" fill="#fff" stroke="#c9d7dd" stroke-width="2"/><text x="952" y="368" class="h">Replay</text><text x="952" y="404" class="b">SVG / snapshot</text><rect x="920" y="464" width="220" height="112" rx="16" fill="#f6ead9" stroke="#e4c79d" stroke-width="2"/><text x="952" y="508" class="h">Inspect</text><text x="952" y="544" class="b">AX / provenance</text><rect x="60" y="560" width="715" height="72" rx="14" fill="#fff7f2" stroke="#eab8a0"/><text x="92" y="604" class="b">The projection changes; the event identity and durable evidence do not.</text></svg>
