<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">MIDI2 event time and asynchronous completion</title><desc id="desc">An ordered MIDI2 event spine is measured with monotonic time, observed by a heartbeat, and completed by a durable terminal receipt.</desc>
<style>.t{font:700 36px -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;fill:#172532}.s{font:400 19px -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;fill:#526875}.e{font:700 13px -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;letter-spacing:2px;fill:#69818d}.h{font:700 22px -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;fill:#172532}.b{font:400 16px -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;fill:#526875}.m{font:600 16px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#dce8ed}</style>
<rect width="1200" height="700" fill="#f5f8f9"/><text x="60" y="58" class="e">EVENT-TIME GOVERNANCE · CHAPTER 104</text><text x="60" y="108" class="t">The event stream outlives the clock</text><text x="60" y="140" class="s">Wall time observes; MIDI2 state and durable evidence decide completion.</text>
<rect x="60" y="214" width="1080" height="126" rx="18" fill="#193448"/><text x="94" y="256" class="m">sequence 01</text><circle cx="110" cy="298" r="10" fill="#efb75b"/><text x="132" y="304" class="m">started</text><path d="M250 298H345" stroke="#79c9c1" stroke-width="3"/><text x="370" y="304" class="m">heartbeat</text><path d="M510 298H605" stroke="#79c9c1" stroke-width="3"/><text x="630" y="304" class="m">progress</text><path d="M755 298H850" stroke="#79c9c1" stroke-width="3"/><text x="875" y="304" class="m">terminal</text>
<rect x="60" y="388" width="320" height="156" rx="16" fill="#e5edf7" stroke="#b7cce1" stroke-width="2"/><text x="90" y="430" class="h">MIDI2 order</text><text x="90" y="466" class="b">sequence + correlation</text><text x="90" y="494" class="b">are lifecycle authority</text><rect x="440" y="388" width="320" height="156" rx="16" fill="#fff" stroke="#c9d7dd" stroke-width="2"/><text x="470" y="430" class="h">Monotonic measure</text><text x="470" y="466" class="b">jitter and gaps are</text><text x="470" y="494" class="b">observed, never guessed</text><rect x="820" y="388" width="320" height="156" rx="16" fill="#f6ead9" stroke="#e4c79d" stroke-width="2"/><text x="850" y="430" class="h">Store receipt</text><text x="850" y="466" class="b">typed terminal event</text><text x="850" y="494" class="b">makes completion durable</text>
<rect x="60" y="594" width="1080" height="54" rx="12" fill="#fff7f2" stroke="#eab8a0"/><text x="90" y="628" class="b">A watchdog may observe an active run; it may not terminate healthy work because wall-clock time passed.</text></svg>
