ion III</text></g><path d="M1034 457V496H277V456" fill="none" stroke="#9f8b6c" stroke-width="2" stroke-dasharray="5 9"/><path d="M270 465L277 455L284 465" fill="none" stroke="#9f8b6c" stroke-width="2"/><text x="655" y="536" text-anchor="middle" font-family="Georgia,serif" font-size="19" fill="#746a5d">Observations return. Authority does not.</text><text x="74" y="580" font-family="Georgia,serif" font-size="15" fill="#746a5d">SKILL SOVEREIGNTY AND GOVERNED DISTRIBUTION</text></svg>