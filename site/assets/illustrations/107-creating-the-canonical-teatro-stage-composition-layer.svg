<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Canonical Teatro stage composition layer</title>
  <desc id="desc">A deterministic architecture diagram showing a source address becoming a structured composition, then projecting to engine, SVG, native, web, and replay surfaces. A side note contrasts this with a flattened ImageGen illustration.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbfaf7"/><stop offset="1" stop-color="#ece8df"/></linearGradient>
    <linearGradient id="stage" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#263b52"/><stop offset="1" stop-color="#142331"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#111827" flood-opacity=".16"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5c7182"/></marker>
    <style>
      .eyebrow{font:600 16px -apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;letter-spacing:3px;fill:#63717b}
      .title{font:700 40px -apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif;fill:#17232b}
      .sub{font:400 19px -apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;fill:#52606a}
      .label{font:700 18px -apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;fill:#17232b}
      .small{font:400 15px -apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;fill:#52606a}
      .mono{font:500 15px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#d9e7ef}
      .white{fill:#f7fbfd}
      .line{stroke:#5c7182;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1400" height="820" fill="url(#paper)"/>
  <text x="70" y="62" class="eyebrow">GOVERNED TEATRO PERSPECTIVE · CHAPTER 107</text>
  <text x="70" y="112" class="title">One composition, many projections</text>
  <text x="70" y="146" class="sub">The missing layer is inspectable structure—not a prettier flat image.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="210" width="260" height="170" rx="18" fill="#fff" stroke="#c9d2d7" stroke-width="2"/>
    <text x="98" y="252" class="label">SOURCE ADDRESS</text>
    <text x="98" y="286" class="small">document · lines 8341–8426</text>
    <text x="98" y="316" class="small">beat · movement · context</text>
    <text x="98" y="346" class="small">authority stays in Reframe</text>
  </g>
  <path d="M330 295 C370 295 370 295 410 295" class="line"/>

  <g filter="url(#shadow)">
    <rect x="410" y="190" width="390" height="210" rx="18" fill="url(#stage)"/>
    <text x="444" y="235" class="label white">CANONICAL TEATRO COMPOSITION</text>
    <text x="444" y="271" class="mono">entities · relations · transforms</text>
    <text x="444" y="300" class="mono">temporal state · provenance</text>
    <circle cx="470" cy="344" r="17" fill="#e7b566"/><circle cx="550" cy="344" r="17" fill="#7bc5bd"/><circle cx="630" cy="344" r="17" fill="#e58b79"/>
    <path d="M487 344 C510 320 530 320 533 344 C560 370 590 370 613 344" stroke="#f2d394" stroke-width="4" fill="none"/>
    <text x="678" y="350" class="mono">stable IDs + typed links</text>
  </g>

  <path d="M800 235 C850 190 870 160 930 150" class="line"/>
  <path d="M800 295 C855 295 875 295 930 295" class="line"/>
  <path d="M800 355 C850 405 870 435 930 440" class="line"/>

  <g filter="url(#shadow)">
    <rect x="930" y="105" width="390" height="95" rx="16" fill="#e4f0ed" stroke="#a6c8c0" stroke-width="2"/>
    <text x="960" y="145" class="label">TEATROSTAGEENGINE</text><text x="960" y="173" class="small">geometry · constraints · stage state</text>
    <rect x="930" y="250" width="390" height="95" rx="16" fill="#e9eef5" stroke="#b4c4d6" stroke-width="2"/>
    <text x="960" y="290" class="label">DETERMINISTIC DOCUMENT</text><text x="960" y="318" class="small">SVG · score · replay snapshot</text>
    <rect x="930" y="395" width="390" height="95" rx="16" fill="#f3e9dc" stroke="#d9b98f" stroke-width="2"/>
    <text x="960" y="435" class="label">NATIVE / WEB PROJECTION</text><text x="960" y="463" class="small">physics host · interactive stage</text>
  </g>

  <g transform="translate(70 510)">
    <rect width="650" height="220" rx="18" fill="#fff" stroke="#d8d1c8" stroke-width="2"/>
    <text x="30" y="42" class="label">INSPECTABLE OBJECT</text>
    <text x="30" y="78" class="mono" fill="#253746">threshold-04</text>
    <text x="30" y="108" class="small">role: threshold · relation: distance</text>
    <text x="30" y="136" class="small">source: lines 8341–8426 · score v1</text>
    <text x="30" y="164" class="small">select → inspect → return to Source View</text>
    <path d="M440 76 C490 50 540 60 585 90" stroke="#df8f74" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
    <circle cx="440" cy="76" r="11" fill="#e7b566"/><circle cx="585" cy="90" r="11" fill="#7bc5bd"/>
  </g>
  <g transform="translate(760 540)">
    <rect width="560" height="170" rx="18" fill="#fff8f3" stroke="#e2b09b" stroke-width="2"/>
    <text x="28" y="38" class="label">NOTE ON CURRENT ILLUSTRATIONS</text>
    <text x="28" y="72" class="small">ImageGen: flattened appearance</text>
    <text x="28" y="100" class="small">Teatro: entities · relations · provenance</text>
    <text x="28" y="128" class="small">Mood boards remain useful; they are not scene authority.</text>
  </g>
  <text x="70" y="785" class="eyebrow">SOURCE-ADDRESSED · DETERMINISTIC · REPLAYABLE · PROJECTION-NEUTRAL</text>
</svg>
