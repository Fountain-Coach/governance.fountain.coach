    <text x="245" y="442" font-size="16">typed dialogue</text><text x="407" y="442" font-size="16">·</text><text x="429" y="442" font-size="16">lifecycle</text><text x="520" y="442" font-size="16">·</text><text x="542" y="442" font-size="16">FountainStore</text><text x="685" y="442" font-size="16">·</text><text x="707" y="442" font-size="16">AX</text><text x="750" y="442" font-size="16">·</text><text x="772" y="442" font-size="16">visual evidence</text>
  </g>
