  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" text-anchor="middle">
    <text x="402" y="256" font-size="13" font-weight="700" fill="#C96A54">INTENTION IN</text>
    <text x="798" y="256" font-size="13" font-weight="700" fill="#C96A54">GROUNDED REPLY</text>
  </g>
  <path d="M70 414H1130" stroke="#4D7478" stroke-width="3"/>
