<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Three concurrent semantic readings form a drift field</title>
  <desc id="desc">A source passage feeds three distinct concurrent reading instruments. Each returns a traceable result, and a measured drift field is calculated only after all three terminal receipts arrive.</desc>
  <rect width="1600" height="900" fill="#f6f3ed"/>
  <path d="M0 110H1600M0 790H1600" stroke="#d9d2c8" stroke-width="2"/>
  <text x="92" y="92" fill="#292725" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="28" letter-spacing="5">SEMANTIC DRIFT · THREE READINGS</text>
  <g font-family="-apple-system,BlinkMacSystemFont,sans-serif" fill="#292725">
    <rect x="90" y="310" width="280" height="220" rx="18" fill="#fffdf9" stroke="#292725" stroke-width="3"/>
    <text x="125" y="370" font-size="24" font-weight="700">SOURCE</text>
    <text x="125" y="414" font-size="20">one exact range</text>
    <text x="125" y="450" font-size="18" fill="#6c665f">identity · digest · lines</text>
    <path d="M370 420H500" stroke="#292725" stroke-width="4"/>
    <path d="M480 404l22 16-22 16" fill="none" stroke="#292725" stroke-width="4"/>
    <rect x="540" y="180" width="300" height="150" rx="16" fill="#dbe8f8" stroke="#2e5c91" stroke-width="3"/>
    <rect x="540" y="375" width="300" height="150" rx="16" fill="#e0f0df" stroke="#397447" stroke-width="3"/>
    <rect x="540" y="570" width="300" height="150" rx="16" fill="#f4dfcf" stroke="#99552d" stroke-width="3"/>
    <text x="575" y="235" font-size="23" font-weight="700">RUN A</text><text x="575" y="274" font-size="18">independent context</text>
    <text x="575" y="430" font-size="23" font-weight="700">RUN B</text><text x="575" y="469" font-size="18">independent context</text>
    <text x="575" y="625" font-size="23" font-weight="700">RUN C</text><text x="575" y="664" font-size="18">independent context</text>
    <path d="M500 420H525M500 420L525 255M500 420L525 645" stroke="#292725" stroke-width="4" fill="none"/>
    <path d="M840 255H1010M840 450H1010M840 645H1010" stroke="#292725" stroke-width="4"/>
    <path d="M990 239l22 16-22 16M990 434l22 16-22 16M990 629l22 16-22 16" fill="none" stroke="#292725" stroke-width="4"/>
    <rect x="1045" y="245" width="420" height="350" rx="20" fill="#292725"/>
    <text x="1090" y="315" fill="#f6f3ed" font-size="25" font-weight="700">DRIFT FIELD</text>
    <text x="1090" y="365" fill="#d9d2c8" font-size="19">compare only after:</text>
    <text x="1090" y="408" fill="#f6f3ed" font-size="18">A · terminal receipt</text>
    <text x="1090" y="445" fill="#f6f3ed" font-size="18">B · terminal receipt</text>
    <text x="1090" y="482" fill="#f6f3ed" font-size="18">C · terminal receipt</text>
    <text x="1090" y="540" fill="#e6b37e" font-size="19">difference ≠ error</text>
    <text x="90" y="850" font-size="20" fill="#6c665f">same source · three identities · one explicit cohort · no collapsed variance</text>
  </g>
</svg>
