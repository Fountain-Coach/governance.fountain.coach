  <text x="1176" y="190" class="tiny muted">OWNER</text>
  <text x="1176" y="238" class="label ink">FOUNTAIN</text>
  <text x="1176" y="264" class="label ink">COACH</text>
  <line x1="1176" y1="292" x2="1304" y2="292" class="line"/>
  <text x="1176" y="326" class="body ink">remediate</text>
  <text x="1176" y="356" class="body ink">accept risk</text>
  <text x="1176" y="386" class="body ink">name build</text>
  <text x="1176" y="410" class="tiny alert">release authority</text>

