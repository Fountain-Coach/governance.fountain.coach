<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">System semantic top for independent security review</title>
  <desc id="desc">A deterministic Reframe design mock separating the governed Codex auth contract, local evidence, independent security review, and Fountain Coach release authority.</desc>
  <defs>
    <style>
      .ink{fill:#23313c}.muted{fill:#667783}.blue{fill:#2d7895}.pale{fill:#eaf3f6}.line{stroke:#8aabb8;stroke-width:2;fill:none}.soft{stroke:#c7d6dc;stroke-width:2;fill:#fff}.label{font:700 18px 'Courier New',monospace;letter-spacing:1px}.body{font:18px 'Courier New',monospace}.title{font:700 24px 'Courier New',monospace;letter-spacing:3px}.tiny{font:14px 'Courier New',monospace;letter-spacing:.6px}.alert{fill:#9b5349}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#5e91a3"/></marker>
  </defs>
  <rect width="1400" height="820" fill="#f7fafb"/>
  <rect x="28" y="28" width="1344" height="764" rx="22" fill="#fff" stroke="#b7cbd3" stroke-width="2"/>
