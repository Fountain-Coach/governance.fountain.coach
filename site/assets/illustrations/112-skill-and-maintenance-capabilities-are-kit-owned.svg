<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Skill and maintenance capabilities are Kit-owned</title><desc id="desc">Procedural projections point to typed Swift Kits, which connect to ReframeCore, MIDI2 host adapters, and FountainStore.</desc>
<style>.t{font:700 36px -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;fill:#172532}.s{font:400 19px -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;fill:#526875}.e{font:700 13px -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;letter-spacing:2px;fill:#69818d}.h{font:700 22px -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;fill:#172532}.b{font:400 16px -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;fill:#526875}.m{font:600 16px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#dce8ed}</style>
<rect width="1200" height="700" fill="#f5f8f9"/><text x="60" y="58" class="e">KIT OWNERSHIP · CHAPTER 112</text><text x="60" y="108" class="t">The contract lives in the Kit</text><text x="60" y="140" class="s">Procedures explain a capability; typed Swift contracts define it.</text>
<rect x="60" y="214" width="260" height="220" rx="18" fill="#fff" stroke="#c9d7dd" stroke-width="2"/><text x="92" y="258" class="h">Procedures</text><text x="92" y="302" class="b">.codex / .claude</text><text x="92" y="334" class="b">commands · scripts · docs</text><text x="92" y="382" class="b">explain · invoke · publish</text><path d="M320 324H445" stroke="#587487" stroke-width="4"/>
<rect x="465" y="184" width="350" height="280" rx="20" fill="#193448"/><text x="500" y="228" class="m">NORMATIVE SWIFT KITS</text><text x="500" y="278" class="m">ReframeSkillKit</text><text x="500" y="310" class="m">FountainCoachMaintenanceKit</text><line x1="500" y1="338" x2="780" y2="338" stroke="#6e91a0" stroke-width="2"/><text x="500" y="378" class="m">stable identity · SemVer</text><text x="500" y="410" class="m">typed request / result</text><text x="500" y="442" class="m">contract before effect</text>
