<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">EstatePublisher local route materialization</title>
  <desc id="desc">Authored route content enters EstatePublisher draft refresh, which patches a disposable preview Store and the already-running FountainStoreHTTP server. An explicit draft check-in writes the accepted route into the durable local candidate. Remote publication is a separate later operation.</desc>
  <defs>
    <marker id="orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b75a20"/></marker>
    <marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#254f78"/></marker>
  </defs>
  <rect width="1200" height="650" rx="28" fill="#f8f5ee"/><rect x="24" y="24" width="1152" height="602" rx="24" fill="none" stroke="#b9c5cf" stroke-width="2"/>
  <text x="70" y="78" fill="#254f78" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="4">GOVERNANCE 147 · LOCAL ROUTE LIFECYCLE</text>
  <text x="70" y="115" fill="#1e2d3d" font-family="Arial,sans-serif" font-size="29" font-weight="700">Refresh first. Check in deliberately. Publish later.</text>
  <rect x="70" y="180" width="230" height="135" rx="18" fill="#e5f1fa" stroke="#6d9fc7" stroke-width="2"/>
  <rect x="365" y="180" width="285" height="135" rx="18" fill="#f6cc7b" stroke="#c27524" stroke-width="2"/>
  <rect x="715" y="180" width="300" height="135" rx="18" fill="#dcefe5" stroke="#6eab87" stroke-width="2"/>
  <text x="95" y="217" fill="#254f78" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="3">AUTHOR</text><text x="95" y="254" fill="#17324d" font-family="Arial,sans-serif" font-size="22" font-weight="700">route or asset</text><text x="95" y="282" fill="#17324d" font-family="Arial,sans-serif" font-size="16">source revision</text>
  <text x="390" y="217" fill="#81430e" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="3">DRAFT REFRESH</text><text x="390" y="254" fill="#17324d" font-family="Arial,sans-serif" font-size="22" font-weight="700">EstatePublisher</text><text x="390" y="282" fill="#17324d" font-family="Arial,sans-serif" font-size="16">atomic patch · no restart</text>
  <text x="740" y="217" fill="#286445" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="3">PREVIEW</text><text x="740" y="254" fill="#17324d" font-family="Arial,sans-serif" font-size="22" font-weight="700">FountainStoreHTTP</text><text x="740" y="282" fill="#17324d" font-family="Arial,sans-serif" font-size="16">review displayed digest</text>
  <path d="M300 247H357" fill="none" stroke="#b75a20" stroke-width="5" marker-end="url(#orange)"/><path d="M650 247H707" fill="none" stroke="#b75a20" stroke-width="5" marker-end="url(#orange)"/>
  <rect x="240" y="405" width="325" height="120" rx="18" fill="#244f78"/><rect x="665" y="405" width="325" height="120" rx="18" fill="#eee5f5" stroke="#9a72af" stroke-width="2"/>
  <text x="270" y="443" fill="#fff" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="3">EXPLICIT CHECK-IN</text><text x="270" y="480" fill="#fff" font-family="Arial,sans-serif" font-size="20" font-weight="700">candidate Store + read-back</text><text x="270" y="505" fill="#fff" font-family="Arial,sans-serif" font-size="15">displayed digest must match</text>
  <text x="695" y="443" fill="#5b3d6c" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="3">LATER ACT</text><text x="695" y="480" fill="#26394d" font-family="Arial,sans-serif" font-size="20" font-weight="700">estate.publication.sync</text><text x="695" y="505" fill="#26394d" font-family="Arial,sans-serif" font-size="15">remote publication · separate proof</text>
  <path d="M865 315V397" fill="none" stroke="#254f78" stroke-width="4" stroke-dasharray="10 9" marker-end="url(#blue)"/><path d="M565 465H650" fill="none" stroke="#254f78" stroke-width="4" marker-end="url(#blue)"/>
  <text x="70" y="585" fill="#46596b" font-family="Arial,sans-serif" font-size="16">One typed route patch supports both update and create; no REST CRUD authority is added.</text>
</svg>
