    <text x="94" y="246" font-size="18">purpose + consent</text><text x="94" y="278" font-size="18">desired outcome</text><text x="94" y="310" font-size="18">writer origin</text>
    <text x="94" y="328" font-size="13" font-weight="700" letter-spacing="1" fill="#C96A54">AUTHORITY · INTENT</text>
    <text x="491" y="190" font-size="20" font-weight="700" letter-spacing="1">COMPOSER</text>
