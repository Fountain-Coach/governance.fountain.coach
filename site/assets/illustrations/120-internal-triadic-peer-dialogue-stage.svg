    <text x="889" y="190" font-size="20" font-weight="700" letter-spacing="1">REFRAME RUNTIME</text>
    <path d="M889 207h125" stroke="#4D7478" stroke-width="4"/>
    <text x="889" y="246" font-size="18">mediation + grounding</text><text x="889" y="278" font-size="18">instruments + execution</text><text x="889" y="310" font-size="18">Store + terminal proof</text>
    <text x="889" y="328" font-size="13" font-weight="700" letter-spacing="1" fill="#4D7478">AUTHORITY · LIVE STATE</text>
  </g>
  <g stroke="#C96A54" stroke-width="3" fill="none">
    <path d="M340 240h105"/><path d="M737 240h105"/>
