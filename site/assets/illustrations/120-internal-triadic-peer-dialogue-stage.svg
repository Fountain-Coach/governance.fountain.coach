<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 510" role="img" aria-labelledby="title desc">
  <title id="title">Internal dialogue stage projection</title>
  <desc id="desc">User intention enters the Composer, a variable agent reasons with it, and Reframe returns a grounded result with durable evidence.</desc>
  <defs>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#233746" flood-opacity=".13"/></filter>
  </defs>
  <rect width="1200" height="510" rx="26" fill="#F7F2E9"/>
  <path d="M55 72H1145" stroke="#D8CDBD" stroke-width="2"/>
