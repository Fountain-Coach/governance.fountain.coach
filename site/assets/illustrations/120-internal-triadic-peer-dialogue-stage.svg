    <text x="65" y="49" font-size="19" font-weight="700" letter-spacing="3" fill="#4D7478">THE INTERNAL DIALOGUE</text>
    <text x="65" y="475" font-size="18" fill="#607176">one intention · one replaceable voice · one runtime authority</text>
  </g>
  <g filter="url(#lift)">
