<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Chapter 158 — Publishing Is Not a Distributed Transaction</title>
<desc id="desc">An authored static publication passes from writer and semantic compiler through scoped authenticated SSH/SFTP to an immutable Caddy release and independent HTTPS verification. FountainStore replication, MIDI2 and host agents remain outside this minimal publishing path.</desc>
