<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">One MIDI2 instrument plane, multiple governed transports</title>
<desc id="desc">A governed instrument operation flows through the shared MIDITransport boundary to RTP-MIDI2, Network MIDI 2.0, or a future transport while MIDI-CI, authorization, operation semantics, and Store evidence remain above the transport seam.</desc>
<rect width="1200" height="630" fill="#f4f0e8"/>
<g font-family="Georgia,serif" fill="#25231f">
<text x="70" y="76" font-size="28" letter-spacing="4" fill="#8b6b3f">GOVERNANCE 150</text>
<text x="70" y="126" font-size="46">One instrument plane.</text>
<text x="70" y="176" font-size="46">Multiple governed transports.</text>
</g>
<g fill="#fffdf8" stroke="#8b6b3f" stroke-width="3">
<rect x="70" y="250" width="235" height="150" rx="12"/><rect x="360" y="250" width="235" height="150" rx="12"/>
<rect x="690" y="205" width="205" height="90" rx="12"/><rect x="690" y="330" width="205" height="90" rx="12"/><rect x="970" y="268" width="160" height="90" rx="12"/>
</g>
<g font-family="Arial,sans-serif" text-anchor="middle" fill="#25231f">
<text x="187" y="305" font-size="22" font-weight="700">GOVERNED</text><text x="187" y="336" font-size="22" font-weight="700">OPERATION</text>
<text x="477" y="305" font-size="22" font-weight="700">MIDI2 INSTRUMENT</text><text x="477" y="336" font-size="22" font-weight="700">PLANE</text>
<text x="792" y="258" font-size="20" font-weight="700">RTP-MIDI2</text><text x="792" y="383" font-size="20" font-weight="700">NETWORK MIDI 2.0</text>
<text x="1050" y="307" font-size="20" font-weight="700">FUTURE</text><text x="1050" y="333" font-size="20" font-weight="700">TRANSPORT</text>
</g>
<g stroke="#25231f" stroke-width="4" fill="none"><path d="M305 325h55"/><path d="M595 325h95"/><path d="M895 250h40v63h35"/><path d="M895 375h40v-62h35"/></g>
<g font-family="Arial,sans-serif" fill="#6a5131"><text x="70" y="500" font-size="20">MIDI-CI · authorization · operation semantics · lifecycle · FountainStore evidence</text><text x="70" y="545" font-size="18">Transport selection changes delivery mechanics, never the governed meaning of the operation.</text></g>
</svg>
