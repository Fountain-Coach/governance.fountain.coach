<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Measured Reframe surface with a proposed illustration feature</title>
  <desc id="desc">A light 1920 by 1080 projection matching the current Swift Reframe window: manuscript and navigation on the left, Copilot on the right, MIDI2 peers below. A proposed illustration card is shown inside the Copilot conversation region and is explicitly not live evidence.</desc>
