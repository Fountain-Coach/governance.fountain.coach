<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="100%" role="img" preserveAspectRatio="xMidYMid meet">
<title>Teatro vector composition</title>
<rect width="100%" height="100%" fill="#f7f9fa"/>
<defs><marker id="teatro-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#5c7487"/></marker></defs>
<text x="72.0" y="70.0" fill="#5c7487" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="18.0" font-weight="700" letter-spacing="4.0">FOUNTAIN COACH · CYBERSECURITY PROFILE</text>
<text x="72.0" y="122.0" fill="#162331" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="40.0" font-weight="700" letter-spacing="0.0">Protect authority. Preserve continuity.</text>
<text x="72.0" y="158.0" fill="#536676" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="21.0" font-weight="400" letter-spacing="0.0">Knowledge may travel; capability stays protected; every boundary leaves evidence.</text>
<rect x="72.0" y="230.0" width="370.0" height="270.0" rx="18.0" fill="#17384d" stroke="#17384d" stroke-width="2"/><text x="96.0" y="264.0" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="17.0" font-weight="700">LIVE AUTHORITY</text><text x="96.0" y="286.0" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="17.0" font-weight="700">FOUNTAINSTORE</text><text x="96.0" y="330.0" fill="#d5e2e9" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="14.0" font-weight="400">state · receipts · provenance</text><text x="96.0" y="351.0" fill="#d5e2e9" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="14.0" font-weight="400">publication and recovery boundary</text><text x="96.0" y="372.0" fill="#d5e2e9" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="14.0" font-weight="400">authority is explicit</text><text x="96.0" y="393.0" fill="#d5e2e9" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="14.0" font-weight="400">history is attributable</text>
<rect x="520.0" y="230.0" width="370.0" height="180.0" rx="18.0" fill="#e6f3f1" stroke="#acdcd5" stroke-width="2"/><text x="544.0" y="264.0" fill="#162331" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="17.0" font-weight="700">INSTITUTIONAL</text><text x="544.0" y="286.0" fill="#162331" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="17.0" font-weight="700">KNOWLEDGE</text><text x="544.0" y="330.0" fill="#536676" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="14.0" font-weight="400">eligible · inspectable · recoverable</text><text x="544.0" y="351.0" fill="#536676" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="14.0" font-weight="400">snapshot → verify → mirror</text>
<rect x="980.0" y="230.0" width="370.0" height="180.0" rx="18.0" fill="#edf4fb" stroke="#c4d9ec" stroke-width="2"/><text x="1004.0" y="264.0" fill="#162331" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="17.0" font-weight="700">VERIFIED CONTINUITY</text><text x="1004.0" y="308.0" fill="#536676" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="14.0" font-weight="400">typed export · manifest · Git projection</text><text x="1004.0" y="329.0" fill="#536676" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="14.0" font-weight="400">restore ≠ authority</text>
<rect x="520.0" y="455.0" width="370.0" height="180.0" rx="18.0" fill="#fff4df" stroke="#efd29f" stroke-width="2"/><text x="544.0" y="489.0" fill="#162331" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="17.0" font-weight="700">PERSONAL CONTEXT</text><text x="544.0" y="533.0" fill="#536676" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="14.0" font-weight="400">purpose-limited · separated · erasable</text><text x="544.0" y="554.0" fill="#536676" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="14.0" font-weight="400">minimum provenance · no reactivation</text>
<rect x="980.0" y="455.0" width="370.0" height="180.0" rx="18.0" fill="#fff0eb" stroke="#f1bda9" stroke-width="2"/><text x="1004.0" y="489.0" fill="#162331" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="17.0" font-weight="700">PROTECTED CAPABILITY</text><text x="1004.0" y="533.0" fill="#536676" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="14.0" font-weight="400">keys · tokens · signing · sessions</text><text x="1004.0" y="554.0" fill="#536676" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="14.0" font-weight="400">SecretStore custody · never open</text>
<line x1="442.0" y1="320.0" x2="510.0" y2="320.0" stroke="#5c7487" stroke-width="2" marker-end="url(#teatro-arrow)"/>
<line x1="890.0" y1="320.0" x2="970.0" y2="320.0" stroke="#5c7487" stroke-width="2" marker-end="url(#teatro-arrow)"/>
<line x1="442.0" y1="410.0" x2="510.0" y2="510.0" stroke="#5c7487" stroke-width="2" marker-end="url(#teatro-arrow)"/>
<line x1="890.0" y1="545.0" x2="970.0" y2="545.0" stroke="#5c7487" stroke-width="2" marker-end="url(#teatro-arrow)"/>
<text x="520.0" y="690.0" fill="#536676" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="16.0" font-weight="400" letter-spacing="0.0">security claim: risk → control → test → evidence → remaining risk</text>
<rect x="72.0" y="720.0" width="1278.0" height="150.0" rx="18.0" fill="#ffffff" stroke="#bfd4df" stroke-width="2"/><text x="96.0" y="754.0" fill="#162331" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="17.0" font-weight="700">THE GOVERNING BOUNDARY</text><text x="96.0" y="798.0" fill="#536676" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="14.0" font-weight="400">Openness can protect eligible knowledge.</text><text x="96.0" y="819.0" fill="#536676" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="14.0" font-weight="400">Confidentiality protects legitimate capability and personal context.</text><text x="96.0" y="840.0" fill="#536676" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="14.0" font-weight="400">authority ≠ obscurity · continuity ≠ indefinite retention · restore ≠ promotion</text>
</svg>
