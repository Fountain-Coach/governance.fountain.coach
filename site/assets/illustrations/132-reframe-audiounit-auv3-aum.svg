<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Reframe AudioUnit AUv3 platform and AUM demo host</title><desc id="desc">A device-side AUv3 runtime flows through AUM as demo host into the MIDI2 lifecycle and FountainStore evidence boundary.</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f5efe4"/><stop offset="1" stop-color="#e8edf2"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#223044" flood-opacity=".18"/></filter></defs><rect width="1200" height="700" rx="36" fill="url(#bg)"/><path d="M90 560h1020" stroke="#b5c4d0" stroke-width="2"/><text x="90" y="92" fill="#536879" font-family="Arial,sans-serif" font-size="20" letter-spacing="4">FCIS · NATIVE AUDIO PLATFORM</text><text x="90" y="140" fill="#202b36" font-family="Georgia,serif" font-size="48">Reframe AudioUnit</text><text x="90" y="178" fill="#536879" font-family="Arial,sans-serif" font-size="22">AUv3 runtime · AUM demo host · explicit MIDI bridge</text><g filter="url(#shadow)"><rect x="90" y="245" width="250" height="210" rx="24" fill="#fffdf9" stroke="#c8d2da"/><rect x="390" y="225" width="300" height="250" rx="28" fill="#263543"/><rect x="740" y="245" width="250" height="210" rx="24" fill="#fffdf9" stroke="#c8d2da"/></g><text x="125" y="292" fill="#6e4b3e" font-family="Arial,sans-serif" font-size="18" letter-spacing="2">IPADOS</text><text x="125" y="340" fill="#202b36" font-family="Georgia,serif" font-size="30">AUv3</text><text x="125" y="377" fill="#536879" font-family="Arial,sans-serif" font-size="17">Realtime audio + MIDI</text><text x="125" y="407" fill="#536879" font-family="Arial,sans-serif" font-size="17">No network in render path</text><text x="430" y="286" fill="#a9c5d8" font-family="Arial,sans-serif" font-size="18" letter-spacing="2">NAMED DEMO HOST</text><text x="430" y="340" fill="#fff" font-family="Georgia,serif" font-size="38">AUM</text><text x="430" y="382" fill="#d1dee8" font-family="Arial,sans-serif" font-size="17">Load witness</text><text x="430" y="412" fill="#d1dee8" font-family="Arial,sans-serif" font-size="17">Routing witness</text><text x="775" y="292" fill="#6e4b3e" font-family="Arial,sans-serif" font-size="18" letter-spacing="2">EVIDENCE</text><text x="775" y="340" fill="#202b36" font-family="Georgia,serif" font-size="30">MIDI2</text><text x="775" y="377" fill="#536879" font-family="Arial,sans-serif" font-size="17">Typed lifecycle</text><text x="775" y="407" fill="#536879" font-family="Arial,sans-serif" font-size="17">Store terminal receipt</text><path d="M340 350h45m305 0h45" stroke="#bd6c4b" stroke-width="5" stroke-linecap="round"/><path d="m372 337 18 13-18 13m305-26 18 13-18 13" fill="none" stroke="#bd6c4b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="90" y="625" fill="#536879" font-family="Arial,sans-serif" font-size="18">Platform intent is not implementation proof · AUM is the host witness, not the authority</text></svg>
