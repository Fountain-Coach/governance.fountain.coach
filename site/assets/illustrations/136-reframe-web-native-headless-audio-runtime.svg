<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Reframe web, native, headless, and audio runtime boundary</title>
  <desc id="desc">Web and native clients send typed MIDI2 intent to one headless Reframe runtime backed by FountainStore, while each user device renders interactive audio locally.</desc>
  <rect width="1200" height="630" rx="28" fill="#f1eee6"/>
  <style>
    .flow-line { stroke-dasharray: 12 10; animation: flow 3.2s linear infinite; }
    .flow-arrow { animation: arrowPulse 3.2s ease-in-out infinite; }
    .runtime-card { animation: runtimePulse 4.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes flow { to { stroke-dashoffset: -44; } }
    @keyframes arrowPulse { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
    @keyframes runtimePulse { 0%, 100% { opacity: .92; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .flow-line, .flow-arrow, .runtime-card { animation: none; }
    }
  </style>
  <path d="M86 472H1114" stroke="#d8d0c0" stroke-width="3"/>
  <g font-family="ui-monospace,Menlo,monospace" fill="#26231f">
    <text x="86" y="92" font-size="21" letter-spacing="4" fill="#8b6250">REFRAME · MULTI-CLIENT RUNTIME</text>
    <text x="86" y="150" font-size="43" font-weight="700">One authority. Many devices.</text>
    <text x="86" y="190" font-size="21" fill="#6d665c">typed intent → governed state → local sound</text>
  </g>
  <g font-family="ui-monospace,Menlo,monospace" text-anchor="middle">
    <g transform="translate(76 268)"><rect width="190" height="132" rx="18" fill="#fffaf0" stroke="#b9ad98" stroke-width="3"/><text x="95" y="43" font-size="16" fill="#8b6250">CLIENTS</text><text x="95" y="78" font-size="18" font-weight="700">Web · iPad</text><text x="95" y="106" font-size="14" fill="#6d665c">native surfaces</text></g>
    <g transform="translate(322 268)"><rect width="190" height="132" rx="18" fill="#26243b"/><text x="95" y="43" font-size="16" fill="#e4bda7">TRANSPORT</text><text x="95" y="78" font-size="18" font-weight="700" fill="#fffaf0">MIDI2</text><text x="95" y="106" font-size="14" fill="#d4cdbf">typed intent</text></g>
    <g class="runtime-card" transform="translate(568 268)"><rect width="190" height="132" rx="18" fill="#fffaf0" stroke="#b9ad98" stroke-width="3"/><text x="95" y="43" font-size="16" fill="#8b6250">AUTHORITY</text><text x="95" y="78" font-size="18" font-weight="700">Linux headless</text><text x="95" y="106" font-size="14" fill="#6d665c">ReframeCore · Store</text></g>
    <g transform="translate(814 268)"><rect width="190" height="132" rx="18" fill="#e5ded0" stroke="#a5967c" stroke-width="3"/><text x="95" y="43" font-size="16" fill="#8b6250">AUDIO</text><text x="95" y="78" font-size="18" font-weight="700">Device render</text><text x="95" y="101" font-size="12" fill="#6d665c">AudioWorklet</text><text x="95" y="119" font-size="12" fill="#6d665c">AVAudioEngine</text></g>
  </g>
  <g class="flow-line" stroke="#a56751" stroke-width="5" fill="none" stroke-linecap="round"><path d="M266 334h48M512 334h48M758 334h48"/></g>
  <g class="flow-arrow" fill="#a56751"><path d="m304 324 16 10-16 10z"/><path d="m550 324 16 10-16 10z"/><path d="m796 324 16 10-16 10z"/></g>
  <text x="600" y="486" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="16" letter-spacing="1" fill="#8b6250">AUDIO NEVER BECOMES THE AUTHORITY</text>
  <text x="600" y="546" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="19" fill="#6d665c">The runtime owns meaning; each device owns interactive sound.</text>
</svg>
