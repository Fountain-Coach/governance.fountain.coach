<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">One spatial thought in reading order</title><desc id="desc">A source address becomes one quiet spatial thought, then a structured Teatro proposal, while the source remains fixed.</desc>
<style>.t{font:700 36px -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;fill:#172532}.s{font:400 19px -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;fill:#526875}.e{font:700 13px -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;letter-spacing:2px;fill:#69818d}.h{font:700 22px -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;fill:#172532}.b{font:400 16px -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;fill:#526875}.m{font:600 16px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#dce8ed}</style>
<rect width="1200" height="700" fill="#f5f8f9"/><text x="60" y="58" class="e">SPATIAL THOUGHT · CHAPTER 105</text><text x="60" y="108" class="t">One thought, anchored in reading order</text><text x="60" y="140" class="s">A quiet marker opens a proposal; it does not decorate or replace the source.</text>
<rect x="60" y="214" width="300" height="250" rx="18" fill="#fff" stroke="#c9d7dd" stroke-width="2"/><text x="92" y="258" class="h">Source View</text><text x="92" y="300" class="b">document · lines 18–26</text><line x1="92" y1="330" x2="320" y2="330" stroke="#d5e0e4" stroke-width="3"/><line x1="92" y1="360" x2="280" y2="360" stroke="#d5e0e4" stroke-width="3"/><line x1="92" y1="390" x2="300" y2="390" stroke="#d5e0e4" stroke-width="3"/><text x="92" y="432" class="b">exact address remains fixed</text><path d="M360 338H485" stroke="#587487" stroke-width="4"/><circle cx="420" cy="338" r="15" fill="#efb75b"/>
<rect x="505" y="214" width="300" height="250" rx="18" fill="#193448"/><text x="540" y="258" class="m">SPATIAL THOUGHT</text><text x="540" y="310" class="m">addressed proposal</text><circle cx="565" cy="365" r="28" fill="#78c9c1"/><circle cx="680" cy="400" r="38" fill="#ee8f7e"/><path d="M590 365C625 342 640 390 665 400" fill="none" stroke="#efb75b" stroke-width="4"/><text x="540" y="438" class="b" fill="#dce8ed">interpretation, not fact</text><path d="M805 338H930" stroke="#587487" stroke-width="4"/>
<rect x="950" y="214" width="190" height="250" rx="18" fill="#e2f1ee" stroke="#a9d1c9" stroke-width="2"/><text x="980" y="258" class="h">Teatro</text><text x="980" y="300" class="b">structured scene</text><text x="980" y="336" class="b">role · relation</text><text x="980" y="372" class="b">geometry</text><text x="980" y="408" class="b">provenance</text><rect x="60" y="560" width="1080" height="72" rx="14" fill="#fff7f2" stroke="#eab8a0"/><text x="92" y="604" class="b">Selection returns to the same source address. The spatial thought is a proposal, never a second navigation authority.</text></svg>
