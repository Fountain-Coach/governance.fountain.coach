<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Domain admission precedes DNS, certificate lifecycle, and edge binding</title>
  <desc id="desc">A governed hostname identity is admitted first, then DNS, certificate lifecycle, and edge binding converge through independent checks and public read-back.</desc>
  <defs>
    <linearGradient id="paper" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f7f2e8"/><stop offset="1" stop-color="#e7ded0"/></linearGradient>
    <linearGradient id="blue" x1="0" x2="1"><stop offset="0" stop-color="#193b4a"/><stop offset="1" stop-color="#286b73"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#193b4a" flood-opacity=".16"/></filter>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0 1 12 7 0 13Z" fill="#c56b45"/></marker>
  </defs>
  <rect width="1200" height="630" fill="url(#paper)"/>
  <path d="M0 520C190 465 330 560 510 510s330-50 690 5v115H0Z" fill="#d7c9b8" opacity=".48"/>
  <text x="70" y="72" font-family="Georgia,serif" font-size="34" fill="#193b4a">Admission is the semantic boundary</text>
  <text x="70" y="108" font-family="Arial,sans-serif" font-size="17" fill="#53666b">Identity first · independent infrastructure capabilities · read-back at the edge</text>
  <g filter="url(#shadow)">
    <rect x="70" y="185" width="295" height="245" rx="22" fill="url(#blue)"/>
    <text x="105" y="235" font-family="Arial,sans-serif" font-size="16" letter-spacing="2" fill="#b7d6d0">ADMITTED IDENTITY</text>
    <text x="105" y="290" font-family="Georgia,serif" font-size="30" fill="#fff">governance.</text>
    <text x="105" y="328" font-family="Georgia,serif" font-size="30" fill="#fff">fountain.coach</text>
    <path d="M108 365h210" stroke="#cfe8e0" stroke-width="2" opacity=".8"/>
    <text x="105" y="397" font-family="Arial,sans-serif" font-size="16" fill="#dbece5">owner-approved domain contract</text>
  </g>
  <g fill="#fff" stroke="#c7b7a6" stroke-width="2" filter="url(#shadow)">
    <rect x="450" y="145" width="230" height="90" rx="16"/><rect x="450" y="285" width="230" height="90" rx="16"/><rect x="450" y="425" width="230" height="90" rx="16"/>
    <rect x="820" y="260" width="280" height="170" rx="20" fill="#fbfaf7" stroke="#286b73" stroke-width="3"/>
  </g>
  <g font-family="Arial,sans-serif" fill="#193b4a">
    <text x="480" y="185" font-size="20">DNS</text><text x="480" y="215" font-size="14" fill="#53666b">resolve the name</text>
    <text x="480" y="325" font-size="20">ACME / TLS</text><text x="480" y="355" font-size="14" fill="#53666b">prove certificate state</text>
    <text x="480" y="465" font-size="20">Edge binding</text><text x="480" y="495" font-size="14" fill="#53666b">serve the admitted host</text>
    <text x="860" y="315" font-size="16" letter-spacing="2" fill="#c56b45">PUBLIC READ-BACK</text>
    <text x="860" y="358" font-family="Georgia,serif" font-size="25">one hostname,</text><text x="860" y="392" font-family="Georgia,serif" font-size="25">three proven layers</text>
  </g>
  <g fill="none" stroke="#c56b45" stroke-width="3" marker-end="url(#arrow)">
    <path d="M365 220C395 220 410 190 440 190"/><path d="M365 305C395 305 410 330 440 330"/><path d="M365 390C395 390 410 470 440 470"/><path d="M680 190C745 190 765 290 810 300"/><path d="M680 330H810"/><path d="M680 470C745 470 765 395 810 390"/>
  </g>
  <text x="70" y="590" font-family="Arial,sans-serif" font-size="16" fill="#53666b">No layer manufactures authority for another; each capability is admitted and verified on its own terms.</text>
</svg>
