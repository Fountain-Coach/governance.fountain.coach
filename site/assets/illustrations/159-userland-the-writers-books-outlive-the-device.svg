<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Userland — the writer's books outlive the device</title>
<desc id="desc">An axonometric Reframe iPad holds an active manuscript on the left. Bidirectional encrypted synchronization joins a Linux Userland containing portable books. A verified recovery copy below and a future replacement host on the right show that source identity is independent of devices and providers.</desc>
<defs>
  <pattern id="paperGrain" width="29" height="29" patternUnits="userSpaceOnUse"><circle cx="4" cy="7" r=".42" fill="#c7beb1" opacity=".22"/><circle cx="19" cy="24" r=".35" fill="#c7beb1" opacity=".19"/></pattern>
  <marker id="point" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#363731" stroke-width="1.15"/></marker>
  <style>
    .fine{stroke:#494b46;stroke-width:1.15;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .hair{stroke:#9a968c;stroke-width:.7;fill:none;stroke-dasharray:3 5}
    .frame{stroke:#343932;stroke-width:1.05;fill:none}
    .label{font:15px 'Courier New',monospace;letter-spacing:1.7px;fill:#292d2a}
    .small{font:11px 'Courier New',monospace;letter-spacing:1.1px;fill:#676963}
    .micro{font:9px 'Courier New',monospace;letter-spacing:.8px;fill:#676963}
  </style>
</defs>
