<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Reframe iPad as a scenario-driven creative host</title><desc id="desc">A scenario resolves governed instruments into an executable topology and runtime experience; a clearly labeled human intervention loop returns from performance to the left edge of the Scenario card, stopping outside it.</desc><rect width="1200" height="630" rx="28" fill="#f1eee6"/><style>.flow-line{stroke-dasharray:12 10;animation:flow 3.2s linear infinite}.flow-arrow{animation:arrowPulse 3.2s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-44}}@keyframes arrowPulse{0%,100%{opacity:.45}50%{opacity:1}}@media (prefers-reduced-motion:reduce){.flow-line,.flow-arrow{animation:none}}</style><path d="M86 475H1114" stroke="#d8d0c0" stroke-width="3"/><g font-family="ui-monospace,Menlo,monospace" fill="#26231f"><text x="86" y="94" font-size="21" letter-spacing="4" fill="#8b6250">REFRAME · CREATIVE HOST GOVERNANCE</text><text x="86" y="151" font-size="45" font-weight="700">A work becomes playable.</text><text x="86" y="190" font-size="21" fill="#6d665c">intention → topology → runtime → human intervention</text></g><g font-family="ui-monospace,Menlo,monospace" text-anchor="middle"><g transform="translate(78 270)"><rect width="190" height="132" rx="18" fill="#fffaf0" stroke="#b9ad98" stroke-width="3"/><text x="95" y="45" font-size="16" fill="#8b6250">AUTHOR</text><text x="95" y="79" font-size="18" font-weight="700">Scenario</text><text x="95" y="106" font-size="14" fill="#6d665c">intention</text></g><g transform="translate(322 270)"><rect width="190" height="132" rx="18" fill="#26243b"/><text x="95" y="45" font-size="16" fill="#e4bda7">RESOLVE</text><text x="95" y="79" font-size="17" font-weight="700" fill="#fffaf0">FCIS Instruments</text><text x="95" y="106" font-size="14" fill="#d4cdbf">capabilities</text></g><g transform="translate(566 270)"><rect width="190" height="132" rx="18" fill="#fffaf0" stroke="#b9ad98" stroke-width="3"/><text x="95" y="45" font-size="16" fill="#8b6250">COMPOSE</text><text x="95" y="79" font-size="17" font-weight="700">Topology</text><text x="95" y="106" font-size="14" fill="#6d665c">audio · MIDI · meaning</text></g><g transform="translate(810 270)"><rect width="190" height="132" rx="18" fill="#e5ded0" stroke="#a5967c" stroke-width="3"/><text x="95" y="45" font-size="16" fill="#8b6250">PERFORM</text><text x="95" y="79" font-size="17" font-weight="700">iPad runtime</text><text x="95" y="106" font-size="14" fill="#6d665c">sound · touch · stage</text></g></g><g class="flow-line" stroke="#a56751" stroke-width="5" fill="none" stroke-linecap="round"><path d="M268 336h42M512 336h42M756 336h42M1000 336C1055 336 1080 375 1080 410C1080 445 1045 455 1000 455H150C80 455 35 410 35 355C35 344 45 336 62 336"/></g><g class="flow-arrow" fill="#a56751"><path d="m304 326 16 10-16 10z"/><path d="m548 326 16 10-16 10z"/><path d="m792 326 16 10-16 10z"/><path d="m62 326 16 10-16 10z"/></g><text x="650" y="486" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="16" letter-spacing="1" fill="#8b6250">HUMAN INTERVENTION → REVISE SCENARIO</text><text x="600" y="548" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="19" fill="#6d665c">The topology stays inspectable, editable, and owned by Reframe.</text></svg>
