    <text x="600" y="309" text-anchor="middle" font-size="20" font-weight="700">shared publication contract</text>
    <text x="600" y="330" text-anchor="middle" font-size="14" fill="#59636e">identity · breadcrumbs · theme · metadata · accessibility · legal · CI</text>
    <text x="180" y="530" text-anchor="middle" font-size="24" font-weight="700">Book</text>
    <text x="180" y="557" text-anchor="middle" font-size="14" fill="#59636e">human reference</text>
    <text x="180" y="579" text-anchor="middle" font-size="13" fill="#59636e">verified behavior</text>
    <text x="465" y="530" text-anchor="middle" font-size="24" font-weight="700">Governance</text>
