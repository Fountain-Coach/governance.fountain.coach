    <text x="1020" y="557" text-anchor="middle" font-size="14" fill="#59636e">company and legal context</text>
    <text x="1020" y="579" text-anchor="middle" font-size="13" fill="#59636e">company and transparency</text>
    <text x="600" y="689" text-anchor="middle" font-size="14" letter-spacing="2" fill="#59636e">DESIGN MOCK · NOT LIVE EVIDENCE</text>
