<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Fountain Coach publication estate design mock</title>
  <desc id="desc">A semantic publication tree from fountain.coach to Book, Governance, Instruments, and Status, with a shared CI and template contract beneath them.</desc>
  <rect width="1200" height="720" fill="#fff"/>
